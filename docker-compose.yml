services:
  # Database: MariaDB
  db:
    image: mariadb:latest
    container_name: mariadb_container
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: school
      MARIADB_USER: user
      MARIADB_PASSWORD: password
    volumes:
      - mariadb_data:/var/lib/mysql # Persist data even if container is deleted
      - ./school-docker-import.sql:/docker-entrypoint-initdb.d/school-docker-import.sql # Auto import DB. Will run only once when container is created
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uuser", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # NoSQL: Redis
  redis:
    image: redis:alpine
    container_name: redis_container
    restart: always
    # Command to enable AOF (Append Only File) mode to make data persistent
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Message Broker: RabbitMQ
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq_container
    restart: always
    ports:
      - "5672:5672"   # Application Port
      - "15672:15672" # Dashboard Management Port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # Spring Boot Application
  app:
    build: .
    container_name: spring_app_container
    ports:
      - "8080:8080"
    volumes:
      - upload_data:/app/uploads/profilepic
    depends_on:
      db:
        condition: service_healthy # Using healthcheck to prevent race condition (app start before db is ready)
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      # Connect to MariaDB (Use 'db' service name as host)
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/school
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      # Connect to Redis (Use 'redis' service name as host)
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Connect to RabbitMQ (Use 'rabbitmq' service name as host)
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      # File upload configuration
      UPLOAD_PATH: /app/uploads/profilepic

volumes:
  # Docker will automatically handle it. Because we use named volume (mariadb_data, redis_data, upload_data).
  # So, the directory (Volume Mount Point) must follow Docker's rule (documentation available in docker hub page of each image)
  # The folder is also handled and managed by Docker. Usually in the: /var/lib/docker/volumes/ (on Linux)
  mariadb_data:
  upload_data:
  redis_data: 