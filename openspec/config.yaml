schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Project: java-rest-api — a minimal yet feature-rich REST API built with Java Spring Boot,
  implementing industry-standard back-end patterns and security practices.

  Tech stack:
    - Language: Java 25 (JDK 25)
    - Framework: Spring Boot 4.0.5 (Web, Security, Data JPA, Actuator, Mail, Thymeleaf, WebSocket, Data Redis)
    - Build tool: Maven
    - Persistence: Dual ORM — JPA/Hibernate (entity mapping + auditing) AND MyBatis (SQL-centric mapping with code generation)
    - Database: MariaDB
    - Cache / session store: Redis
    - Message broker: RabbitMQ
    - Auth: JWT (jjwt 0.11.5), Google OAuth2 / SSO, MFA/TFA (2FA)
    - API docs: Swagger / OpenAPI (springdoc)
    - Containerization: Docker Compose

  Base package: com.github.donnyk22
  Source layout (src/main/java/com/github/donnyk22/):
    - configurations/   Spring @Configuration classes (e.g. SecurityConfig, MyBatisConfig)
    - controllers/      REST controllers (API endpoints under /api/v1/...)
    - exceptions/       Custom exceptions & global handlers
    - models/           DTOs and entities (models/entities/mybatis for MyBatis models)
    - repositories/     Data access (repositories/mybatis for MyBatis mapper interfaces)
    - services/         Business logic
    - utils/            Utilities
    - web/              WebSocket / OAuth2 test HTML pages
  Resources (src/main/resources/):
    - application.properties / application-dev.properties / application-prd.properties (copy from *.example)
    - my-batis-generator-config.xml   MyBatis Generator config
    - mybatis/                         SQL XML mappers

  Key features: JWT auth, Google OAuth2 SSO, MFA, multiple login sessions, brute-force
  protection, ACL, web security headers (XSS/clickjacking/MIME/referrer/CORS), WebSocket,
  RabbitMQ async messaging, API caching, rate limiting, virtual threads, file upload,
  Excel/Word/Zip export, email (MailTrap), audit trail (JPA @Audited + manual), request
  tracing, Swagger docs.

  Conventions:
    - REST endpoints are versioned under /api/v1/
    - When changing the DB schema, MyBatis artifacts can be regenerated with:
        mvn mybatis-generator:generate
      (requires a live MariaDB connection — the generator introspects the live schema)
    - Run locally: mvn clean install && mvn spring-boot:run  (Swagger at /swagger-ui/index.html)

